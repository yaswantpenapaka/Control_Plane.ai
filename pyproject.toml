[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlplane-ai"
version = "0.1.0"
description = "AI governance middleware for enterprise workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "VARANASI Team", email = "varanasi@accenture.com"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']
